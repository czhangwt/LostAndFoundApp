[project]
name = "lostandfoundapp"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "email-validator>=2.0.0",
    "fastapi[standard]>=0.142.0",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "pydantic>=2.13.5",
    "pyjwt>=2.15.1",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.fastapi]
entrypoint = "main:app"
